name: Build Android APK (CharpsDev)

# ---------------------------------------------------------------------------
# Builds the Capacitor Android shell in mobile/ and uploads the resulting
# APK as a workflow artifact. The shell contains no app logic of its own —
# its WebView just loads the live https://charpsdev.vercel.app site (see
# mobile/capacitor.config.ts) — so this workflow only needs to run whenever
# mobile/ itself changes (native shell config, icons, Gradle setup), not on
# every frontend/ change. Trigger it manually any time you want a fresh APK.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build a Play Store .aab bundle (in addition to the .apk)"
        type: boolean
        default: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile/ dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing secrets found — decoding keystore for a signed release build."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building with Android's default debug signing instead."
            echo "This APK will install fine on a device/emulator for testing but is NOT suitable for a Play Store upload."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (optional, for Play Store upload)
        if: ${{ inputs.build_aab == true }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: charpsdev-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: ${{ inputs.build_aab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: charpsdev-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### CharpsDev Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed with release keystore: **${{ steps.keystore.outputs.signed }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- WebView target: https://charpsdev.vercel.app (see mobile/capacitor.config.ts)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the APK from this run's **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"
          
