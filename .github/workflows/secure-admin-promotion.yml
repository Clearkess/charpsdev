name: Promote existing user to admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Exact email address of the existing account to promote"
        required: true
        type: string
      confirm:
        description: "Type PROMOTE to confirm this one-time action"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-admin-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm == 'PROMOTE' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_SSLMODE: require
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up PHP and PostgreSQL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Verify the promotion command exists
        run: |
          php artisan list --raw | grep -F 'user:make-admin' >/dev/null

      - name: Configure explicit Neon connection variables
        shell: bash
        run: |
          php <<'PHP'
          <?php
          $url = getenv('DB_URL');
          $parts = is_string($url) ? parse_url($url) : false;

          if (!is_array($parts) || empty($parts['host']) || empty($parts['path'])) {
              fwrite(STDERR, "NEON_DATABASE_URL is missing a valid PostgreSQL host or database path. Check the GitHub Actions secret without printing it.\n");
              exit(1);
          }

          $values = [
              'DB_HOST' => $parts['host'],
              'DB_PORT' => (string) ($parts['port'] ?? 5432),
              'DB_DATABASE' => rawurldecode(ltrim($parts['path'], '/')),
              'DB_USERNAME' => rawurldecode($parts['user'] ?? ''),
              'DB_PASSWORD' => rawurldecode($parts['pass'] ?? ''),
              'DB_SSLMODE' => 'require',
              'DB_URL' => '',
          ];

          foreach ($values as $key => $value) {
              if (str_contains($value, "\n") || str_contains($value, "\r")) {
                  fwrite(STDERR, "Database connection value contains an invalid line break.\n");
                  exit(1);
              }
              file_put_contents(getenv('GITHUB_ENV'), $key . '=' . $value . "\n", FILE_APPEND);
          }
          PHP

      - name: Verify Neon database connection
        run: php artisan db:show --database=pgsql --no-interaction

      - name: Promote the specified existing account
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          if [ -z "$ADMIN_EMAIL" ]; then
            echo "An account email is required."
            exit 1
          fi
          php artisan user:make-admin "$ADMIN_EMAIL" --no-interaction
